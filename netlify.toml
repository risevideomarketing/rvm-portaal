[build]
  command = "npm run build"
  publish = "dist"

# Geen OAuth: .well-known bestaat niet (anders denkt Claude dat de MCP-koppeling een inlog heeft)
[[redirects]]
  from = "/.well-known/*"
  to = "/404"
  status = 404
  force = true

# Single page app: alle routes naar index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow"
